<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App 4 - Loja Gamer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <h1>🛒 Loja Gamer</h1>
        <p>Itens no carrinho: <strong id="contador-itens">0</strong></p>
    </header>
    <main class="layout">
        <!-- Vitrine: os produtos são criados pelo JavaScript -->
        <section>
            <h2>Produtos</h2>
            <div id="vitrine" class="vitrine"></div>
        </section>
        <!-- Carrinho -->
        <aside class="carrinho">
            <h2>🛒 Carrinho</h2>
            <ul id="lista-carrinho" class="lista-carrinho"></ul>
            <p id="carrinho-vazio" class="vazio">Seu carrinho está vazio.</p>
            <div class="total">
                <span>Total</span>
                <strong id="total">R$ 0,00</strong>
            </div>
            <button id="botao-limpar" class="botao-limpar">Esvaziar carrinho</button>
        </aside>
    </main>
    <script src="script.js"></script>
</body>
</html>
